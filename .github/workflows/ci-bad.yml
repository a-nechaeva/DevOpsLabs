name: CI/CD Pipeline - BAD PRACTICES

on:
  push:
    branches: [main]
    paths:
      - 'lab4/**'
      - '.github/workflows/**'          
  pull_request:
    branches: [main]
    paths:
      - 'lab4/**' 
      - '.github/workflows/**'        

jobs:
  monolith-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-python@master
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r lab4/requirements-dev.txt

      - name: Lint code
        run: flake8 lab4/

      - name: Build package
        run: python -m build
        working-directory: ./lab4
        env:
          API_KEY: "sk-1234567890abcdef"
          DB_PASSWORD: "super_secret_123"

      - name: Run tests
        run: pytest

      - name: Deploy to production
        run: |
          echo "Deploying..."
          curl -X POST https://api.example.com/deploy \
            -H "Authorization: Bearer prod_token_xyz" \
            -d '{"env": "production"}'

      - name: Notify
        run: echo "Pipeline finished"