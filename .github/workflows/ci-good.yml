name: CI/CD Pipeline - BEST PRACTICES

on:
  push:
    branches: [main]
    paths:
      - 'lab4/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'lab4/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:
    name:  Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r lab4/requirements-dev.txt
      - run: flake8 lab4/app.py lab4/test_app.py

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install pip-audit
      - run: pip-audit -r lab4/requirements.txt

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [lint, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r lab4/requirements-dev.txt
      - run: pytest --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v3

  build:
    name:  Build Package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
        working-directory: ./lab4
      - run: python -m build
        working-directory: ./lab4
      - uses: actions/upload-artifact@v4
        with:
          name: flask-package
          path: lab4/dist/
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flask-package
          path: dist/
      - name: Deploy
        run: |
          echo " Deploying built package..."
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}